<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Meu primeiro programa...</title>
    <style>
        body{
            background-color: rgb(105, 105, 173);
            color: white;
            font: normal 20pt Arial;
        }
        h1
        {
            color: rgb(255, 212, 22);
        }
    </style>
</head>
<body>
   
     <script>
       var nome = window.prompt('QUAL É O SEU NOME ?')
       document.write(`Olá <strong>${nome}<strong> ! Seu nome tem ${nome.length} letras. <br/>`)
       document.write(`seu nome em maiusculas é ${nome.toUpperCase()}`)
       document.write(`seu nome em maiusculas é ${nome.toUpperCase()}<br/>`)
       document.write(`seu nome em minusculas é ${nome.toLowerCase()}`)
    </script>
    
    <h1>OLÁ MUNDO</h1>
    <p>me livrei da maldição !!!</p>
    
</body>
</html>
